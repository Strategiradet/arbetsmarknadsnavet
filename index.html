<!-- Märket som ikon i flikraden. Samma figur som i rubriken, lagd som data-URI,
     så att sidan är en enda fil utan bilder att ladda upp vid sidan av. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='7.5' r='4' fill='%23382f23'/%3E%3Ccircle cx='53.22' cy='19.75' r='4' fill='%23a08a5e'/%3E%3Ccircle cx='53.22' cy='44.25' r='4' fill='%23382f23'/%3E%3Ccircle cx='32' cy='56.5' r='4' fill='%23a08a5e'/%3E%3Ccircle cx='10.78' cy='44.25' r='4' fill='%23382f23'/%3E%3Ccircle cx='10.78' cy='19.75' r='4' fill='%23a08a5e'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23382f23'/%3E%3Ccircle cx='32' cy='32' r='3.2' fill='%23c9b78f'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Paletten är verktygets egen, tagen ur dess variabler, så att sidan och
   verktyget ser ut att höra ihop. */
:root{
  --papper:#faf7f0;
  --black:#382f23;          /* bläck, brödtext */
  --blackmjuk:#6d6252;
  --gron:#66703f;           /* djupgrön, andra ledet i namnet */
  --petrol:#2d6378;
  --petrol-ljus:#3b7992;
  --ton:#a08a5e;            /* märkets tonade prickar */
  --nav:#c9b78f;            /* märkets mitt */
  --linje:#e9e1d4;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 16px;
  background:var(--papper);
  color:var(--black);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  line-height:1.55;
  /* Verktyget har en varm, nästan omärklig lyster uppåt i ytan. Samma här. */
  background-image:radial-gradient(120% 85% at 50% 0%,#fdfbf6 0%,var(--papper) 62%);
}

main{
  width:100%;
  max-width:600px;
  text-align:center;
  animation:stig .5s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes stig{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.marke{
  width:68px;height:68px;
  display:block;margin:0 auto 22px;
  color:var(--black);           /* currentColor i märket */
}

h1{
  margin:0;
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;
  font-weight:800;
  /* Golvet är satt så att namnet ryms på en rad på en 320 px bred skärm.
     Namnet är ett enda långt ord och ska inte brytas mitt itu. */
  font-size:clamp(25px,7.4vw,45px);
  letter-spacing:-.018em;
  line-height:1.12;
}
h1 .andra{color:var(--gron)}

/* Raderna är korta, och utan utjämning hamnar ett ensamt ord på sista raden.
   text-wrap:balance delar upp dem jämnt; webbläsare som saknar stödet bryter
   som förut, vilket fungerar men ser sämre ut. */
.beskrivning,.omraden,.anvisning{text-wrap:balance}

.beskrivning{
  margin:14px auto 0;
  max-width:34em;
  font-size:clamp(15px,2.6vw,17.5px);
  color:var(--blackmjuk);
}

/* Raden som leder in i knappen. Mindre än beskrivningen ovanför, och nära
   knappen under, så att de två läses som ett stycke och inte som två
   fristående rader. */
.anvisning{
  margin:30px auto 0;
  max-width:30em;
  font-size:15px;
  color:var(--blackmjuk);
}

.lank{
  display:inline-flex;
  align-items:center;
  gap:.6em;
  margin-top:13px;
  padding:15px 28px;
  border-radius:11px;
  background:var(--petrol);
  color:#fff;
  font-size:clamp(16px,3.4vw,18px);
  font-weight:600;
  letter-spacing:.005em;
  text-decoration:none;
  box-shadow:0 1px 2px rgba(56,47,35,.14),0 6px 18px -8px rgba(45,99,120,.5);
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
}
.lank:hover{
  background:var(--petrol-ljus);
  transform:translateY(-1px);
  box-shadow:0 1px 2px rgba(56,47,35,.14),0 10px 24px -8px rgba(45,99,120,.55);
}
.lank:active{transform:none}
.lank:focus-visible{outline:3px solid var(--gron);outline-offset:3px}
.lank .pil{font-size:1.05em;line-height:1}

.omraden{
  margin:26px auto 0;
  max-width:36em;
  font-size:13.5px;
  color:var(--blackmjuk);
  letter-spacing:.012em;
}
.omraden span{white-space:nowrap}
.prick{color:var(--ton);font-style:normal;padding-left:.42em}


@media (max-width:420px){
  body{padding:34px 16px}
  .marke{width:58px;height:58px;margin-bottom:18px}
  .lank{width:100%;justify-content:center;padding:15px 20px}
}

@media (prefers-reduced-motion:reduce){
  main{animation:none}
  .lank{transition:none}
  .lank:hover{transform:none}
}
</style>
</head>

<body>
<main>

  <!-- Verktygets eget märke: sex punkter i en ring med ekrar in mot navet.
       Figuren är kopierad ur verktyget, med färgvariablerna utskrivna. -->
  <svg class="marke" viewBox="0 0 64 64" role="img" aria-label="Arbetsmarknadsnavets märke">
    <circle cx="32.00" cy="7.50"  r="4" fill="currentColor"/>
    <circle cx="53.22" cy="19.75" r="4" fill="var(--ton)"/>
    <circle cx="53.22" cy="44.25" r="4" fill="currentColor"/>
    <circle cx="32.00" cy="56.50" r="4" fill="var(--ton)"/>
    <circle cx="10.78" cy="44.25" r="4" fill="currentColor"/>
    <circle cx="10.78" cy="19.75" r="4" fill="var(--ton)"/>
    <line x1="32.00" y1="21.10" x2="32.00" y2="15.40" stroke="var(--ton)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="41.44" y1="26.55" x2="46.38" y2="23.70" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="41.44" y1="37.45" x2="46.38" y2="40.30" stroke="var(--ton)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="32.00" y1="42.90" x2="32.00" y2="48.60" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="22.56" y1="37.45" x2="17.62" y2="40.30" stroke="var(--ton)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="22.56" y1="26.55" x2="17.62" y2="23.70" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="7"   fill="currentColor"/>
    <circle cx="32" cy="32" r="3.2" fill="var(--nav)"/>
  </svg>

  <h1>Arbetsmarknads<span class="andra">navet</span></h1>

  <p class="beskrivning">Ett verktyg för svensk arbetsmarknadsstatistik och jobbannonsdata.</p>

  <p class="anvisning">Arbetsmarknadsnavet finns tillgängligt på följande länk:</p>

  <a class="lank" href="https://arbetsmarknadsnavet.se/">
    arbetsmarknadsnavet.se<span class="pil" aria-hidden="true">&#8594;</span>
  </a>

  <!-- Varje led bär sin egen avskiljare och bryts inte isär. Mellanrummen
       mellan leden är de enda radbrytningsställena, så en ny rad börjar aldrig
       med en punkt, och raden ryms på en smal skärm. -->
  <p class="omraden">
    <span>Kompetenser<i class="prick" aria-hidden="true">·</i></span>
    <span>Yrken<i class="prick" aria-hidden="true">·</i></span>
    <span>Branscher<i class="prick" aria-hidden="true">·</i></span>
    <span>Län<i class="prick" aria-hidden="true">·</i></span>
    <span>Kommuner<i class="prick" aria-hidden="true">·</i></span>
    <span>Utbildningar</span>
  </p>

</main>
</body>
</html>
